name: Build Project Tracker AI

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: ProjectTrackerAI-windows
          - os: macos-latest
            artifact_name: ProjectTrackerAI-mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          SEP=":"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then SEP=";"; fi
          pyinstaller --noconfirm --clean \
            --name ProjectTrackerAI \
            --add-data "web${SEP}web" \
            --add-data "client_secrets${SEP}client_secrets" \
            --hidden-import telethon \
            --collect-all telethon \
            --collect-all google.genai \
            --collect-all groq \
            --collect-all openai \
            --collect-all pydrive2 \
            --collect-all oauth2client \
            --collect-all googleapiclient \
            --collect-all google_auth_httplib2 \
            --collect-all google_auth_oauthlib \
            --collect-all reportlab \
            --collect-all apscheduler \
            --collect-all sqlalchemy \
            --collect-all certifi \
            --collect-all httpx \
            app_main.py

      - name: Add double-click launcher (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cat > dist/ProjectTrackerAI/Launch\ ProjectTrackerAI.command << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./ProjectTrackerAI
          EOF
          chmod +x dist/ProjectTrackerAI/Launch\ ProjectTrackerAI.command
          chmod +x dist/ProjectTrackerAI/ProjectTrackerAI

      - name: Zip build output
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path ProjectTrackerAI -DestinationPath ${{ matrix.artifact_name }}.zip"
          else
            zip -r ${{ matrix.artifact_name }}.zip ProjectTrackerAI
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip
